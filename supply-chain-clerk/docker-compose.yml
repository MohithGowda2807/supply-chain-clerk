version: '3.8'

services:
  neo4j:
    image: neo4j:5.18-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/smartguard123
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "smartguard123", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:7860"
    depends_on:
      neo4j:
        condition: service_healthy
      mosquitto:
        condition: service_started
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      MQTT_BROKER: mosquitto
    volumes:
      - ./backend:/app
    restart: unless-stopped

volumes:
  neo4j_data:
